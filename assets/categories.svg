<linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
<stop offset="0" stop-color="#00d4ff"/><stop offset=".35" stop-color="#818cf8"/><stop offset=".65" stop-color="#c084fc"/><stop offset="1" stop-color="#4ade80"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-.6 0;.6 0;-.6 0" dur="8s" repeatCount="indefinite"/></linearGradient>
