<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 276" width="980" height="276" role="img" aria-label="The ten element categories, colour coded">
<title>The ten element categories, colour coded</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset=".55" stop-color="#0a1628"/><stop offset="1" stop-color="#0f1f3d"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".62"><stop offset="0" stop-color="#030712" stop-opacity=".94"/><stop offset=".55" stop-color="#030712" stop-opacity=".72"/><stop offset="1" stop-color="#030712" stop-opacity="0"/></radialGradient>
